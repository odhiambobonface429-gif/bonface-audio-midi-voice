name: Build Bonface Audio MIDI Voice

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -S BonfaceAudioMIDIVoice -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Bonface-Audio-MIDI-Voice-VST3
          path: build/**/*.vst3
